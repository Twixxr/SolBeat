name: Update Solana Ecosystem Report

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    env:
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject landing-page outlook
        run: python scripts/inject_outlook.py

      - name: Generate report
        run: python -m src.main

      - name: Commit updated data and dashboard
        run: |
          git config user.name "solbeat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/index.html data/latest.json data/latest.md data/history.jsonl dashboard/data.json
          git diff --cached --quiet || git commit -m "chore: refresh Solana ecosystem report [skip ci]"

          # Another scheduled/manual run may have pushed while this run was generating data.
          # Rebase onto the latest main before pushing so report refreshes don't fail on races.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-pages:
    needs: update-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
