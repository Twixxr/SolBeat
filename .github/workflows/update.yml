name: Update Solana Ecosystem Report

on:
  schedule:
    # Every 30 minutes. Adjust to taste — Solana RPC / CoinGecko free tiers
    # can handle this comfortably. Tighten for a more "live" dashboard,
    # loosen if you see rate-limit errors in the Action logs.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual refresh from the Actions tab
  push:
    branches: [main]      # also refresh on every push to main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        run: python -m src.main

      - name: Commit updated data
        run: |
          git config user.name "solpulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/latest.md data/history.jsonl dashboard/data.json
          git diff --cached --quiet || git commit -m "chore: refresh Solana ecosystem report [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-pages:
    needs: update-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
