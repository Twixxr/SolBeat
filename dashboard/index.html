<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolPulse Canada — Solana Ecosystem Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0a0b0d;
    --panel: #111318;
    --panel-border: #1e2129;
    --text: #e8e9ec;
    --text-dim: #8b909c;
    --text-faint: #565b66;
    --purple: #9945FF;
    --green: #14F195;
    --crit: #ff5c5c;
    --warn: #ffb454;
    --info: #5ac8ff;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  a{color:var(--green);text-decoration:none;}
  a:hover{text-decoration:underline;}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;
    padding-bottom:20px;margin-bottom:6px;border-bottom:1px solid var(--panel-border);}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.02em;}
  .brand .sub{font-family:var(--mono);font-size:12px;color:var(--text-dim);}
  .updated{font-family:var(--mono);font-size:12px;color:var(--text-dim);text-align:right;}
  .updated .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);
    margin-right:6px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .pulsebar{height:3px;width:100%;margin:0 0 22px;border-radius:2px;overflow:hidden;
    background:linear-gradient(90deg, var(--purple), var(--green));background-size:200% 100%;
    animation:flow 6s linear infinite;}
  @keyframes flow{0%{background-position:0% 0;}100%{background-position:-200% 0;}}
  @media (prefers-reduced-motion: reduce){
    .pulsebar{animation:none;} .updated .dot{animation:none;}
  }

  .tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--panel-border);
    overflow-x:auto;}
  .tab-btn{background:none;border:none;color:var(--text-dim);font-family:var(--sans);font-size:13px;
    font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;
    white-space:nowrap;transition:color .15s;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--text);border-bottom-color:var(--green);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  #alerts{margin-bottom:24px;display:flex;flex-direction:column;gap:8px;}
  .alert{font-family:var(--mono);font-size:13px;padding:10px 14px;border-radius:6px;border:1px solid;
    display:flex;gap:10px;align-items:baseline;}
  .alert.critical{border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.08);color:var(--crit);}
  .alert.warning{border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.08);color:var(--warn);}
  .alert.info{border-color:rgba(90,200,255,.4);background:rgba(90,200,255,.08);color:var(--info);}
  .alert.ok{border-color:rgba(20,241,149,.35);background:rgba(20,241,149,.06);color:var(--green);}
  .alert .badge{text-transform:uppercase;font-weight:700;font-size:10px;letter-spacing:.06em;}

  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
    margin:30px 0 12px;font-weight:600;}
  h2.section:first-child{margin-top:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px,1fr));gap:12px;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:16px 18px;}
  .card .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px;}
  .card .value{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.1;}
  .card .value.sm{font-size:18px;}
  .card .delta{font-family:var(--mono);font-size:12px;margin-top:6px;}
  .delta.up{color:var(--green);}
  .delta.down{color:var(--crit);}
  .delta.flat{color:var(--text-dim);}

  .epoch-card{display:flex;align-items:center;gap:16px;}
  .ring{position:relative;width:64px;height:64px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:13px;font-weight:600;}

  .chart-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:18px;margin-top:12px;}
  .chart-card .chart-title{font-size:12px;color:var(--text-dim);margin-bottom:12px;
    text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .chart-wrap{position:relative;height:260px;}
  .chart-wrap.tall{height:340px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);
    padding:8px 10px;border-bottom:1px solid var(--panel-border);font-weight:600;}
  td{padding:9px 10px;border-bottom:1px solid var(--panel-border);font-family:var(--mono);color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .table-wrap{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;overflow:hidden;overflow-x:auto;}
  .mono-dim{color:var(--text-faint);}

  .list-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:6px 18px;}
  .list-item{padding:14px 0;border-bottom:1px solid var(--panel-border);display:flex;justify-content:space-between;
    align-items:center;gap:12px;flex-wrap:wrap;}
  .list-item:last-child{border-bottom:none;}
  .list-item .name{font-weight:600;font-size:14px;}
  .list-item .desc{color:var(--text-dim);font-size:13px;margin-top:4px;line-height:1.5;}
  .twitter-link{font-family:var(--mono);font-size:12px;background:rgba(20,241,149,.08);
    border:1px solid rgba(20,241,149,.3);padding:5px 10px;border-radius:6px;flex:none;}
  .twitter-link:hover{background:rgba(20,241,149,.16);text-decoration:none;}

  .controls{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .controls label{font-size:12px;color:var(--text-dim);font-family:var(--mono);}
  select{background:var(--panel);color:var(--text);border:1px solid var(--panel-border);
    border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:12px;}

  .note{font-size:12px;color:var(--text-faint);font-style:italic;line-height:1.5;margin-top:8px;}

  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--panel-border);
    font-size:12px;color:var(--text-faint);font-family:var(--mono);}

  .loading{font-family:var(--mono);color:var(--text-dim);padding:40px 0;text-align:center;}
  .err{font-family:var(--mono);color:var(--crit);padding:16px;border:1px solid rgba(255,92,92,.4);
    border-radius:8px;background:rgba(255,92,92,.06);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>SolPulse <span style="color:var(--green)">Canada</span></h1>
      <span class="sub">// solana ecosystem report</span>
    </div>
    <div class="updated" id="updated">loading…</div>
  </header>
  <div class="pulsebar"></div>

  <div id="alerts"></div>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="network">Network</button>
    <button class="tab-btn" data-tab="validators">Validators</button>
    <button class="tab-btn" data-tab="defi">DeFi</button>
    <button class="tab-btn" data-tab="ecosystem">Ecosystem</button>
  </nav>

  <div id="content">
    <div class="loading">Fetching latest snapshot…</div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const DATA_URL = "data.json";
let REPORT = null, ANOMALIES = [], HISTORY = [];
const CHARTS = {};

Chart.defaults.color = "#8b909c";
Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.font.size = 11;
const GRID_COLOR = "#1e2129";

function fmtUsd(v){
  if(v === null || v === undefined) return "N/A";
  const abs = Math.abs(v);
  if(abs >= 1e9) return "$" + (v/1e9).toFixed(2) + "B";
  if(abs >= 1e6) return "$" + (v/1e6).toFixed(2) + "M";
  if(abs >= 1e3) return "$" + (v/1e3).toFixed(1) + "K";
  return "$" + v.toFixed(2);
}
function fmtNum(v, decimals=2){
  if(v === null || v === undefined) return "N/A";
  return Number(v).toLocaleString(undefined, {maximumFractionDigits: decimals});
}
function fmtPct(v){
  if(v === null || v === undefined) return "N/A";
  const sign = v > 0 ? "+" : "";
  return sign + v.toFixed(2) + "%";
}
function deltaClass(v){
  if(v === null || v === undefined) return "flat";
  return v > 0 ? "up" : (v < 0 ? "down" : "flat");
}
function statCard(label, value, deltaText, deltaCls, small=false){
  return `<div class="card">
    <div class="label">${label}</div>
    <div class="value ${small ? 'sm':''}">${value}</div>
    ${deltaText ? `<div class="delta ${deltaCls}">${deltaText}</div>` : ""}
  </div>`;
}
function epochRing(pct){
  pct = pct === null || pct === undefined ? 0 : pct;
  const r = 26, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `<div class="ring">
    <svg width="64" height="64">
      <circle cx="32" cy="32" r="${r}" stroke="#1e2129" stroke-width="6" fill="none"/>
      <circle cx="32" cy="32" r="${r}" stroke="url(#grad)" stroke-width="6" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
      <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#9945FF"/><stop offset="100%" stop-color="#14F195"/>
      </linearGradient></defs>
    </svg>
    <div class="pct">${pct.toFixed(0)}%</div>
  </div>`;
}
function twitterHandleUrl(handle){
  return "https://twitter.com/" + handle.replace(/^@/, "");
}
function destroyChart(id){
  if(CHARTS[id]){ CHARTS[id].destroy(); delete CHARTS[id]; }
}
function lineChart(id, labels, datasets, yFormatter){
  destroyChart(id);
  const ctx = document.getElementById(id);
  if(!ctx) return;
  CHARTS[id] = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: {mode: "index", intersect: false},
      plugins: { legend: { display: datasets.length > 1, labels: {boxWidth: 10} } },
      scales: {
        x: { grid: { color: GRID_COLOR }, ticks: { maxTicksLimit: 8 } },
        y: { grid: { color: GRID_COLOR }, ticks: { callback: yFormatter || (v => v) } }
      }
    }
  });
}
function barChart(id, labels, data, label, horizontal=false, colorFn=null){
  destroyChart(id);
  const ctx = document.getElementById(id);
  if(!ctx) return;
  const colors = colorFn ? labels.map((_,i)=>colorFn(i)) : "#14F195";
  CHARTS[id] = new Chart(ctx, {
    type: "bar",
    data: { labels, datasets: [{ label, data, backgroundColor: colors, borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      indexAxis: horizontal ? "y" : "x",
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: GRID_COLOR } },
        y: { grid: { color: GRID_COLOR } }
      }
    }
  });
}

function renderAlerts(anomalies){
  const el = document.getElementById("alerts");
  if(!anomalies || anomalies.length === 0){
    el.innerHTML = `<div class="alert ok"><span class="badge">OK</span> No anomalies detected in this snapshot.</div>`;
    return;
  }
  const order = {critical:0, warning:1, info:2};
  const sorted = [...anomalies].sort((a,b)=>order[a.severity]-order[b.severity]);
  el.innerHTML = sorted.map(a =>
    `<div class="alert ${a.severity}"><span class="badge">${a.severity}</span> ${a.message}</div>`
  ).join("");
}

function renderOverview(){
  const net = REPORT.network_performance || {};
  const val = REPORT.validators || {};
  const supply = REPORT.supply || {};
  const defi = REPORT.defi || {};
  const tvl = defi.tvl || {};
  const market = (REPORT.market || {}).price || {};

  let html = `<h2 class="section">Network Performance</h2><div class="grid">`;
  html += statCard("Current TPS", fmtNum(net.current_tps, 0));
  html += statCard("Avg TPS", fmtNum(net.avg_tps, 0));
  html += statCard("Avg Slot Time", fmtNum(net.avg_slot_time_ms,0) + " ms");
  html += statCard("Block Height", fmtNum(net.block_height, 0), null, null, true);
  html += `<div class="card epoch-card">${epochRing(net.epoch_progress_pct)}
    <div><div class="label">Epoch ${net.epoch ?? "N/A"}</div>
    <div class="value sm">${fmtNum(net.epoch_progress_pct,1)}% complete</div></div></div>`;
  html += statCard("RPC Health", (net.health === "ok" ? "🟢 ok" : (net.health || "N/A")), null, null, true);
  html += `</div>`;

  html += `<h2 class="section">Economic Snapshot</h2><div class="grid">`;
  html += statCard("SOL Price", fmtUsd(market.price_usd), fmtPct(market.price_change_pct_24h) + " (24h)", deltaClass(market.price_change_pct_24h));
  html += statCard("Chain TVL", fmtUsd(tvl.tvl_usd), fmtPct(tvl.tvl_change_pct_24h) + " (24h)", deltaClass(tvl.tvl_change_pct_24h));
  html += statCard("Active Validators", fmtNum(val.active_count, 0));
  html += statCard("Total SOL Supply", fmtNum(supply.total_sol, 0));
  html += `</div>`;

  document.getElementById("tab-overview").innerHTML = html;
}

function renderNetwork(){
  const net = REPORT.network_performance || {};

  let html = `<h2 class="section">Live Metrics</h2><div class="grid">`;
  html += statCard("Current TPS", fmtNum(net.current_tps, 0));
  html += statCard("Avg / Max / Min TPS", `${fmtNum(net.avg_tps,0)} / ${fmtNum(net.max_tps,0)} / ${fmtNum(net.min_tps,0)}`, null, null, true);
  html += statCard("Avg Slot Time", fmtNum(net.avg_slot_time_ms,0) + " ms");
  html += statCard("Current Slot", fmtNum(net.current_slot, 0), null, null, true);
  html += `</div>`;

  html += `<h2 class="section">Estimated Daily Transactions (trend)</h2>`;
  html += `<div class="chart-card"><div class="chart-title">Derived from avg TPS × 86,400s per snapshot — a proxy, not an exact daily tx count</div>
    <div class="chart-wrap"><canvas id="chart-tx-trend"></canvas></div></div>`;

  html += `<h2 class="section">Unique Active Wallets</h2>`;
  html += `<div class="list-card"><div class="list-item"><div class="desc">
    Not available from this project's keyless data sources (Solana RPC / DeFiLlama / CoinGecko don't expose
    unique active-wallet counts). Getting this reliably requires a paid indexer (e.g. Dune, Flipside, Artemis).
    Left as a documented limitation rather than shown with fabricated numbers — see README "Known limitations."
    </div></div></div>`;

  html += `<h2 class="section">TPS Trend (recent snapshots)</h2>`;
  html += `<div class="chart-card"><div class="chart-wrap"><canvas id="chart-tps-trend"></canvas></div></div>`;

  document.getElementById("tab-network").innerHTML = html;

  const labels = HISTORY.map(h => new Date(h.generated_at_unix * 1000).toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}));
  const tpsValues = HISTORY.map(h => h.network_performance ? h.network_performance.avg_tps : null);
  const txEstimate = tpsValues.map(v => v === null ? null : Math.round(v * 86400));

  lineChart("chart-tps-trend", labels, [{
    label: "Avg TPS", data: tpsValues, borderColor: "#14F195",
    backgroundColor: "rgba(20,241,149,0.08)", fill: true, tension: 0.3, pointRadius: 0
  }]);
  lineChart("chart-tx-trend", labels, [{
    label: "Est. txs/day", data: txEstimate, borderColor: "#9945FF",
    backgroundColor: "rgba(153,69,255,0.08)", fill: true, tension: 0.3, pointRadius: 0
  }], v => fmtUsd(v).replace("$",""));
}

function renderValidators(){
  const val = REPORT.validators || {};
  const top = val.top_validators || [];

  let html = `<h2 class="section">Validator Status</h2><div class="grid">`;
  html += statCard("Active Validators", fmtNum(val.active_count, 0));
  html += statCard("Delinquent Validators", fmtNum(val.delinquent_count, 0));
  html += statCard("Delinquent Stake %", fmtNum(val.delinquent_stake_pct, 2) + "%");
  const conc = val.stake_concentration || {};
  html += statCard("Validators to 33% Stake", fmtNum(conc.validators_to_control_33pct, 0));
  html += `</div>`;

  html += `<h2 class="section">Stake Distribution</h2>`;
  html += `<div class="controls">
    <label for="val-count-select">Show top</label>
    <select id="val-count-select">
      <option value="10">10 validators</option>
      <option value="20" selected>20 validators</option>
      <option value="${top.length}">All fetched (${top.length})</option>
    </select>
  </div>`;
  html += `<div class="chart-card"><div class="chart-title">Active stake (SOL) by validator</div>
    <div class="chart-wrap tall"><canvas id="chart-validator-stake"></canvas></div></div>`;

  if(top.length){
    html += `<div class="table-wrap" style="margin-top:16px;"><table>
      <thead><tr><th>#</th><th>Vote Account</th><th>Stake (SOL)</th><th>Commission</th><th>Last Vote</th></tr></thead>
      <tbody>`;
    top.forEach((v,i)=>{
      html += `<tr><td>${i+1}</td><td>${v.vote_pubkey ? v.vote_pubkey.slice(0,6)+"…"+v.vote_pubkey.slice(-6) : "N/A"}</td>
        <td>${fmtNum(v.activated_stake_sol,0)}</td><td>${v.commission_pct}%</td>
        <td class="mono-dim">${v.last_vote ?? "N/A"}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  document.getElementById("tab-validators").innerHTML = html;

  function draw(count){
    const subset = top.slice(0, count);
    const labels = subset.map(v => v.vote_pubkey ? v.vote_pubkey.slice(0,4)+"…"+v.vote_pubkey.slice(-4) : "?");
    const data = subset.map(v => v.activated_stake_sol);
    barChart("chart-validator-stake", labels, data, "Stake (SOL)", true,
      i => `rgba(20,241,149,${1 - i*0.03})`);
  }
  draw(20);
  document.getElementById("val-count-select").addEventListener("change", (e) => draw(parseInt(e.target.value, 10)));
}

function renderDefi(){
  const defi = REPORT.defi || {};
  const tvl = defi.tvl || {};
  const stable = defi.stablecoins || {};
  const dex = defi.dex_volume || {};
  const fees = defi.fees_and_rev || {};
  const protocols = (defi.top_protocols || {}).protocols || [];

  let html = `<h2 class="section">Chain-Wide Metrics</h2><div class="grid">`;
  html += statCard("Chain TVL", fmtUsd(tvl.tvl_usd), fmtPct(tvl.tvl_change_pct_24h) + " (24h)", deltaClass(tvl.tvl_change_pct_24h));
  html += statCard("TVL Change (7d)", fmtPct(tvl.tvl_change_pct_7d), null, null, true);
  html += statCard("Stablecoin Supply", fmtUsd(stable.total_stablecoin_supply_usd));
  html += statCard("DEX Volume (24h)", fmtUsd(dex.dex_volume_24h_usd));
  html += statCard("Chain Revenue / REV (24h)", fmtUsd(fees.chain_revenue_24h_usd));
  html += `</div>`;

  html += `<h2 class="section">TVL Trend</h2>`;
  html += `<div class="chart-card"><div class="chart-wrap"><canvas id="chart-tvl-trend"></canvas></div></div>`;

  html += `<h2 class="section">TVL Split by Protocol</h2>`;
  html += `<div class="chart-card"><div class="chart-title">Top ${protocols.length} Solana protocols by TVL</div>
    <div class="chart-wrap tall"><canvas id="chart-protocols"></canvas></div></div>`;
  if(protocols.length){
    html += `<div class="table-wrap" style="margin-top:16px;"><table>
      <thead><tr><th>#</th><th>Protocol</th><th>Category</th><th>TVL</th><th>% of Chain TVL</th><th>24h</th></tr></thead>
      <tbody>`;
    protocols.forEach((p,i)=>{
      html += `<tr><td>${i+1}</td><td>${p.url ? `<a href="${p.url}" target="_blank">${p.name}</a>` : p.name}</td>
        <td class="mono-dim">${p.category || "—"}</td><td>${fmtUsd(p.tvl_usd)}</td>
        <td>${fmtNum(p.pct_of_solana_tvl,2)}%</td>
        <td>${fmtPct(p.change_1d_pct)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  html += `<h2 class="section">TVL Split by Coin (stablecoins)</h2>`;
  const breakdown = stable.breakdown || {};
  const coinLabels = Object.keys(breakdown);
  if(coinLabels.length){
    html += `<div class="chart-card"><div class="chart-title">Stablecoin supply on Solana by peg type</div>
      <div class="chart-wrap"><canvas id="chart-coins"></canvas></div></div>
      <div class="note">DeFiLlama does not expose a single keyless "TVL by underlying token" endpoint across
      an entire chain (it would require one call per protocol). This chart shows the closest available
      keyless breakdown — stablecoin supply by peg type. See README for details.</div>`;
  } else {
    html += `<div class="list-card"><div class="list-item"><div class="desc">No coin-level breakdown available in this snapshot.</div></div></div>`;
  }

  document.getElementById("tab-defi").innerHTML = html;

  const labels = HISTORY.map(h => new Date(h.generated_at_unix * 1000).toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}));
  const tvlValues = HISTORY.map(h => h.defi && h.defi.tvl ? h.defi.tvl.tvl_usd : null);
  lineChart("chart-tvl-trend", labels, [{
    label: "Chain TVL", data: tvlValues, borderColor: "#9945FF",
    backgroundColor: "rgba(153,69,255,0.08)", fill: true, tension: 0.3, pointRadius: 0
  }], v => fmtUsd(v));

  if(protocols.length){
    barChart("chart-protocols", protocols.map(p=>p.name), protocols.map(p=>p.tvl_usd), "TVL", true,
      i => `rgba(153,69,255,${1 - i*0.05})`);
  }
  if(coinLabels.length){
    barChart("chart-coins", coinLabels, coinLabels.map(k=>breakdown[k]), "Supply (USD)", false);
  }
}

function renderEcosystem(){
  const social = REPORT.social || {};
  const upcoming = REPORT.upcoming || [];

  let html = `<h2 class="section">Ecosystem &amp; Community Watchlist</h2>`;
  if(social._note){
    html += `<div class="note" style="margin-bottom:10px;">${social._note}</div>`;
  }
  html += `<div class="list-card">`;
  (social.accounts || []).forEach(acc=>{
    html += `<div class="list-item">
      <div><div class="name">${acc.handle}</div><div class="desc">${acc.reason}</div></div>
      <a class="twitter-link" href="${twitterHandleUrl(acc.handle)}" target="_blank" rel="noopener">Open on X →</a>
    </div>`;
  });
  html += `</div>`;

  html += `<h2 class="section">Upcoming Upgrades &amp; Developments</h2><div class="list-card">`;
  upcoming.forEach(u=>{
    html += `<div class="list-item"><div><div class="name">${u.name}</div>
      <div class="desc">${u.description}</div></div>
      <a class="twitter-link" href="${u.track}" target="_blank" rel="noopener">Track →</a></div>`;
  });
  html += `</div>`;

  document.getElementById("tab-ecosystem").innerHTML = html;
}

function renderAllTabs(){
  renderOverview();
  renderNetwork();
  renderValidators();
  renderDefi();
  renderEcosystem();
}

function setupTabs(){
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });
}

async function load(){
  try{
    const res = await fetch(DATA_URL, {cache: "no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const payload = await res.json();
    REPORT = payload.report;
    ANOMALIES = payload.anomalies || [];
    HISTORY = payload.history_series || [];

    document.getElementById("updated").innerHTML =
      `<span class="dot"></span>updated ${REPORT.meta.generated_at_utc}`;
    renderAlerts(ANOMALIES);

    if(document.getElementById("tab-overview") === null){
      document.getElementById("content").innerHTML = `
        <div class="tab-panel active" id="tab-overview"></div>
        <div class="tab-panel" id="tab-network"></div>
        <div class="tab-panel" id="tab-validators"></div>
        <div class="tab-panel" id="tab-defi"></div>
        <div class="tab-panel" id="tab-ecosystem"></div>
      `;
      setupTabs();
    }
    renderAllTabs();

    document.getElementById("footer").innerHTML =
      `Data: Solana RPC · DeFiLlama · CoinGecko — refreshed automatically. ` +
      `<a href="https://github.com/YOUR_GITHUB_USERNAME/solpulse-canada" target="_blank">Source on GitHub</a>`;
  }catch(err){
    document.getElementById("content").innerHTML =
      `<div class="err">Couldn't load data.json (${err.message}). If you're running this locally, ` +
      `run <code>python -m src.main</code> first to generate dashboard/data.json, then reload.</div>`;
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
