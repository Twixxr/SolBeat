<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolBeat — Solana Ecosystem Heartbeat</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0a0b0d;
    --panel: #111318;
    --panel-border: #1e2129;
    --text: #e8e9ec;
    --text-dim: #8b909c;
    --text-faint: #565b66;
    --purple: #9945FF;
    --green: #14F195;
    --crit: #ff5c5c;
    --warn: #ffb454;
    --info: #5ac8ff;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  a{color:var(--green);text-decoration:none;}
  a:hover{text-decoration:underline;}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;
    padding-bottom:20px;margin-bottom:6px;border-bottom:1px solid var(--panel-border);}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.02em;}
  .brand .sub{font-family:var(--mono);font-size:12px;color:var(--text-dim);}
  .updated{font-family:var(--mono);font-size:12px;color:var(--text-dim);text-align:right;}
  .updated .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);
    margin-right:6px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .heartbeat-wrap{position:relative;overflow:hidden;height:44px;width:100%;margin:0 0 22px;
    border-radius:8px;
    background:
      repeating-linear-gradient(90deg, rgba(20,241,149,.07) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(0deg, rgba(20,241,149,.07) 0 1px, transparent 1px 11px),
      #060706;
    border:1px solid var(--panel-border);
    box-shadow: inset 0 0 18px rgba(0,0,0,.7), inset 0 0 2px rgba(20,241,149,.15);}
  .heartbeat-label{position:absolute;top:5px;left:9px;font-family:var(--mono);font-size:9px;
    color:var(--green);letter-spacing:.12em;text-transform:uppercase;opacity:.75;z-index:2;
    text-shadow:0 0 4px rgba(20,241,149,.6);}
  .heartbeat-svg{height:100%;width:100%;display:block;}
  .heartbeat-path{fill:none;stroke:var(--green);stroke-width:2;
    filter:drop-shadow(0 0 4px rgba(20,241,149,.65));
    stroke-dasharray:100 100;stroke-dashoffset:100;
    animation:heartbeat-draw 4s ease-in-out infinite;}
  @keyframes heartbeat-draw{
    0%{stroke-dashoffset:100;opacity:0;}
    4%{opacity:1;}
    72%{stroke-dashoffset:0;opacity:1;}
    85%{stroke-dashoffset:0;opacity:1;}
    96%{opacity:0;}
    100%{stroke-dashoffset:0;opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .heartbeat-path{animation:none;stroke-dashoffset:0;opacity:1;}
    .updated .dot{animation:none;}
  }

  .tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--panel-border);
    overflow-x:auto;}
  .tab-btn{background:none;border:none;color:var(--text-dim);font-family:var(--sans);font-size:13px;
    font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;
    white-space:nowrap;transition:color .15s;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--text);border-bottom-color:var(--green);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  #alerts{margin-bottom:24px;display:flex;flex-direction:column;gap:8px;}
  .alert{font-family:var(--mono);font-size:13px;padding:10px 14px;border-radius:6px;border:1px solid;
    display:flex;gap:10px;align-items:baseline;}
  .alert.critical{border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.08);color:var(--crit);}
  .alert.warning{border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.08);color:var(--warn);}
  .alert.info{border-color:rgba(90,200,255,.4);background:rgba(90,200,255,.08);color:var(--info);}
  .alert.ok{border-color:rgba(20,241,149,.35);background:rgba(20,241,149,.06);color:var(--green);}
  .alert .badge{text-transform:uppercase;font-weight:700;font-size:10px;letter-spacing:.06em;}

  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
    margin:30px 0 12px;font-weight:600;}
  h2.section:first-child{margin-top:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px,1fr));gap:12px;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:16px 18px;}
  .card .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px;}
  .card .value{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.1;}
  .card .value.sm{font-size:18px;}
  .card .delta{font-family:var(--mono);font-size:12px;margin-top:6px;}
  .delta.up{color:var(--green);}
  .delta.down{color:var(--crit);}
  .delta.flat{color:var(--text-dim);}

  .card.expandable{cursor:pointer;transition:border-color .15s;}
  .card.expandable:hover{border-color:rgba(20,241,149,.4);}
  .card.expandable .expand-hint{font-family:var(--mono);font-size:10px;color:var(--text-faint);
    margin-top:8px;display:flex;align-items:center;gap:4px;}

  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
  .modal-backdrop.open{display:flex;}
  .modal-panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
    padding:26px;max-width:960px;width:100%;max-height:88vh;overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:16px;}
  .modal-title{font-size:19px;font-weight:700;letter-spacing:-0.01em;}
  .modal-subtitle{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.5;}
  .modal-close{background:none;border:1px solid var(--panel-border);color:var(--text-dim);
    border-radius:8px;width:34px;height:34px;flex:none;cursor:pointer;font-size:15px;transition:.15s;}
  .modal-close:hover{color:var(--text);border-color:var(--text-dim);}
  .modal-chart-wrap{height:420px;position:relative;}
  .modal-note{font-family:var(--mono);font-size:12px;color:var(--text-faint);margin-top:14px;
    padding-top:14px;border-top:1px solid var(--panel-border);}
  @media (max-width:600px){
    .modal-panel{padding:18px;}
    .modal-chart-wrap{height:280px;}
  }

  .epoch-card{display:flex;align-items:center;gap:16px;}
  .ring{position:relative;width:64px;height:64px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:13px;font-weight:600;}

  .chart-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:18px;margin-top:12px;}
  .chart-card .chart-title{font-size:12px;color:var(--text-dim);margin-bottom:12px;
    text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .chart-wrap{position:relative;height:260px;}
  .chart-wrap.tall{height:340px;}
  .tradingview-widget-container{height:460px;width:100%;}
  .tradingview-widget-container__widget{height:100%;width:100%;}
  @media (max-width:600px){
    .tradingview-widget-container{height:320px;}
  }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);
    padding:8px 10px;border-bottom:1px solid var(--panel-border);font-weight:600;}
  td{padding:9px 10px;border-bottom:1px solid var(--panel-border);font-family:var(--mono);color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .table-wrap{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;overflow:hidden;overflow-x:auto;}
  .mono-dim{color:var(--text-faint);}

  .list-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:6px 18px;}
  .list-item{padding:14px 0;border-bottom:1px solid var(--panel-border);display:flex;justify-content:space-between;
    align-items:center;gap:12px;flex-wrap:wrap;}
  .list-item:last-child{border-bottom:none;}
  .list-item .name{font-weight:600;font-size:14px;}
  .list-item .desc{color:var(--text-dim);font-size:13px;margin-top:4px;line-height:1.5;}
  .twitter-link{font-family:var(--mono);font-size:12px;background:rgba(20,241,149,.08);
    border:1px solid rgba(20,241,149,.3);padding:5px 10px;border-radius:6px;flex:none;}
  .twitter-link:hover{background:rgba(20,241,149,.16);text-decoration:none;}

  .controls{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .controls label{font-size:12px;color:var(--text-dim);font-family:var(--mono);}
  select{background:var(--panel);color:var(--text);border:1px solid var(--panel-border);
    border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:12px;}

  .note{font-size:12px;color:var(--text-faint);font-style:italic;line-height:1.5;margin-top:8px;}

  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--panel-border);
    font-size:12px;color:var(--text-faint);font-family:var(--mono);}

  .loading{font-family:var(--mono);color:var(--text-dim);padding:40px 0;text-align:center;}
  .err{font-family:var(--mono);color:var(--crit);padding:16px;border:1px solid rgba(255,92,92,.4);
    border-radius:8px;background:rgba(255,92,92,.06);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Sol<span style="color:var(--green)">Beat</span></h1>
      <span class="sub">// solana ecosystem heartbeat</span>
    </div>
    <div class="updated" id="updated">loading…</div>
  </header>
  <div class="heartbeat-wrap" id="heartbeat">
    <div class="heartbeat-label">HR // SOL-MAINNET</div>
    <svg class="heartbeat-svg" id="heartbeat-svg" viewBox="0 0 1200 40" preserveAspectRatio="none">
      <path class="heartbeat-path" id="heartbeat-path" pathLength="100" d="M0,20 L500,20
        L530,20 L540,16 L550,20
        L570,20 L580,34 L590,2 L600,36 L610,20
        L630,14 L640,20
        L1200,20"/>
    </svg>
  </div>

  <div id="alerts"></div>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="network">Network</button>
    <button class="tab-btn" data-tab="validators">Validators</button>
    <button class="tab-btn" data-tab="defi">Onchain DeFi</button>
    <button class="tab-btn" data-tab="ecosystem">Ecosystem</button>
  </nav>

  <div id="content">
    <div class="loading">Fetching latest snapshot…</div>
  </div>

  <footer id="footer"></footer>
</div>

<div class="modal-backdrop" id="historyModalBackdrop" onclick="if(event.target===this) closeHistoryModal();">
  <div class="modal-panel">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="historyModalTitle"></div>
        <div class="modal-subtitle" id="historyModalSubtitle"></div>
      </div>
      <button class="modal-close" onclick="closeHistoryModal()">✕</button>
    </div>
    <div class="modal-chart-wrap" id="historyModalChartWrap"><canvas id="historyModalCanvas"></canvas></div>
    <div class="modal-note" id="historyModalNote"></div>
  </div>
</div>

<script>
const DATA_URL = "data.json";
let REPORT = null, ANOMALIES = [], HISTORY = [];
let LAST_GENERATED_UNIX = null;
const CHARTS = {};

Chart.defaults.color = "#8b909c";
Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.font.size = 11;
const GRID_COLOR = "#1e2129";

function fmtUsd(v){
  if(v === null || v === undefined) return "N/A";
  const abs = Math.abs(v);
  if(abs >= 1e9) return "$" + (v/1e9).toFixed(2) + "B";
  if(abs >= 1e6) return "$" + (v/1e6).toFixed(2) + "M";
  if(abs >= 1e3) return "$" + (v/1e3).toFixed(1) + "K";
  return "$" + v.toFixed(2);
}
function fmtNum(v, decimals=2){
  if(v === null || v === undefined) return "N/A";
  return Number(v).toLocaleString(undefined, {maximumFractionDigits: decimals});
}
function fmtPct(v){
  if(v === null || v === undefined) return "N/A";
  const sign = v > 0 ? "+" : "";
  return sign + v.toFixed(2) + "%";
}
function deltaClass(v){
  if(v === null || v === undefined) return "flat";
  return v > 0 ? "up" : (v < 0 ? "down" : "flat");
}
function twitterHandleUrl(handle){
  return "https://twitter.com/" + handle.replace(/^@/, "");
}
function isTwitterUrl(url){
  return /(^|\/\/)(www\.)?(twitter\.com|x\.com)\//i.test(url || "");
}

function relativeTimeString(unixSeconds){
  if(!unixSeconds) return "";
  const diff = Math.max(0, Math.floor(Date.now()/1000) - unixSeconds);
  if(diff < 5) return "just now";
  if(diff < 60) return diff + "s ago";
  const mins = Math.floor(diff/60);
  if(mins < 60) return mins + " minute" + (mins===1?"":"s") + " ago";
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + " hour" + (hrs===1?"":"s") + " ago";
  const days = Math.floor(hrs/24);
  return days + " day" + (days===1?"":"s") + " ago";
}
function tickUpdatedLabel(){
  if(!LAST_GENERATED_UNIX) return;
  document.getElementById("updated").innerHTML =
    "<span class=\"dot\"></span>updated " + relativeTimeString(LAST_GENERATED_UNIX);
}

function destroyChart(id){
  if(CHARTS[id]){ CHARTS[id].destroy(); delete CHARTS[id]; }
}
function lineChart(id, labels, datasets, yFormatter, opts){
  opts = opts || {};
  destroyChart(id);
  const ctx = document.getElementById(id);
  if(!ctx) return;
  CHARTS[id] = new Chart(ctx, {
    type: "line",
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: {mode: "index", intersect: false},
      plugins: { legend: { display: !!opts.legend && datasets.length > 1, labels: {boxWidth: 10} } },
      scales: {
        x: { display: opts.axes !== false, grid: { color: GRID_COLOR }, ticks: { maxTicksLimit: 6 } },
        y: { display: opts.axes !== false, grid: { color: GRID_COLOR }, ticks: { callback: yFormatter || function(v){return v;}, maxTicksLimit: 4 } }
      }
    }
  });
}
function barChart(id, labels, data, label, horizontal, colorFn){
  destroyChart(id);
  const ctx = document.getElementById(id);
  if(!ctx) return;
  const colors = colorFn ? labels.map(function(_,i){return colorFn(i);}) : "#14F195";
  CHARTS[id] = new Chart(ctx, {
    type: "bar",
    data: { labels: labels, datasets: [{ label: label, data: data, backgroundColor: colors, borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      indexAxis: horizontal ? "y" : "x",
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: GRID_COLOR } },
        y: { grid: { color: GRID_COLOR } }
      }
    }
  });
}
const PIE_PALETTE = ["#14F195","#9945FF","#5ac8ff","#ffb454","#ff5c5c","#5eead4","#f472b6","#a3e635","#fb923c","#60a5fa","#c084fc","#94a3b8"];
function pieChart(id, labels, data){
  destroyChart(id);
  const ctx = document.getElementById(id);
  if(!ctx) return;
  const colors = labels.map(function(_,i){ return PIE_PALETTE[i % PIE_PALETTE.length]; });
  CHARTS[id] = new Chart(ctx, {
    type: "doughnut",
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderColor: "#111318", borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "right", labels: { boxWidth: 10, color: "#8b909c", font: {size: 10} } },
        tooltip: { callbacks: { label: function(ctx){ return ctx.label + ": " + ctx.parsed.toFixed(2) + "%"; } } }
      }
    }
  });
}

function statCard(label, value, deltaText, deltaCls, small){
  return "<div class=\"card\"><div class=\"label\">" + label + "</div>" +
    "<div class=\"value " + (small?"sm":"") + "\">" + value + "</div>" +
    (deltaText ? "<div class=\"delta " + deltaCls + "\">" + deltaText + "</div>" : "") +
    "</div>";
}

let CARD_COUNTER = 0;
const CARD_REGISTRY = {};

function getByPath(obj, path){
  return path.split(".").reduce(function(o,k){ return (o && o[k] !== undefined) ? o[k] : null; }, obj);
}
function seriesForPath(path){
  return HISTORY.map(function(h){ return getByPath(h, path); });
}
function historyLabels(){
  return HISTORY.map(function(h){
    return new Date(h.generated_at_unix * 1000).toLocaleString(undefined,
      {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  });
}
function formatDateLabel(unixSeconds){
  return new Date(unixSeconds * 1000).toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"});
}
function latestChangePct(series){
  if(!series || series.length < 2) return null;
  const last = series[series.length - 1].value;
  const prev = series[series.length - 2].value;
  if(prev === null || prev === undefined || prev === 0 || last === null || last === undefined) return null;
  return 100 * (last - prev) / prev;
}

/** A stat card that, when clicked, opens a large modal chart of its history.
 *  `longHistoryKey` (optional) points into REPORT.long_history.<key>.series —
 *  a multi-year daily series from DeFiLlama/CoinGecko, used when available.
 *  `historyPath` is the fallback dot-path into this project's own short
 *  rolling snapshot history, used when no long-run source exists for that
 *  metric (e.g. TPS, validator count). */
function expandableStatCard(label, value, deltaText, deltaCls, historyPath, color, formatter, small, longHistoryKey){
  const id = "ecard-" + (CARD_COUNTER++);
  CARD_REGISTRY[id] = { label: label, historyPath: historyPath, color: color, formatter: formatter, longHistoryKey: longHistoryKey || null };
  return "<div class=\"card expandable\" id=\"" + id + "\" onclick=\"openHistoryModal('" + id + "')\">" +
    "<div class=\"label\">" + label + "</div>" +
    "<div class=\"value " + (small?"sm":"") + "\">" + value + "</div>" +
    (deltaText ? "<div class=\"delta " + deltaCls + "\">" + deltaText + "</div>" : "") +
    "<div class=\"expand-hint\"><span class=\"chevron\">⤢</span> click to expand history</div>" +
    "</div>";
}

function openHistoryModal(id){
  const meta = CARD_REGISTRY[id];
  if(!meta) return;

  document.getElementById("historyModalTitle").textContent = meta.label;

  let series = null, sourceNote = "";
  if(meta.longHistoryKey){
    const lh = getByPath(REPORT, "long_history." + meta.longHistoryKey + ".series");
    if(lh && lh.length){
      series = lh;
      sourceNote = "Full daily history since " + formatDateLabel(lh[0].date_unix) +
        " — sourced from DeFiLlama / CoinGecko.";
    }
  }
  if(!series && meta.historyPath){
    const shortValues = seriesForPath(meta.historyPath);
    series = HISTORY.map(function(h, i){ return {date_unix: h.generated_at_unix, value: shortValues[i]}; })
      .filter(function(p){ return p.value !== null && p.value !== undefined; });
    sourceNote = "No long-run public data source exists for this metric — showing history since this " +
      "report started tracking it" + (series.length ? (" (" + formatDateLabel(series[0].date_unix) + ")") : "") + ".";
  }

  document.getElementById("historyModalSubtitle").textContent = sourceNote;
  const noteEl = document.getElementById("historyModalNote");
  const chartWrap = document.getElementById("historyModalChartWrap");
  document.getElementById("historyModalBackdrop").classList.add("open");

  if(!series || series.length < 2){
    chartWrap.innerHTML = "<canvas id=\"historyModalCanvas\"></canvas>";
    noteEl.textContent = "Not enough history yet — check back after a few more automatic refreshes.";
    return;
  }

  chartWrap.innerHTML = "<canvas id=\"historyModalCanvas\"></canvas>";
  const change = latestChangePct(series);
  noteEl.textContent = change !== null
    ? ("Change vs. previous data point: " + (change > 0 ? "+" : "") + change.toFixed(2) + "%")
    : "";

  const labels = series.map(function(p){ return formatDateLabel(p.date_unix); });
  const values = series.map(function(p){ return p.value; });

  setTimeout(function(){
    lineChart("historyModalCanvas", labels, [{
      data: values, borderColor: meta.color, backgroundColor: meta.color + "22",
      fill: true, tension: 0.25, pointRadius: 0
    }], meta.formatter, { axes: true });
  }, 30);
}

function closeHistoryModal(){
  document.getElementById("historyModalBackdrop").classList.remove("open");
}
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeHistoryModal();
});

function epochRing(pct){
  pct = (pct === null || pct === undefined) ? 0 : pct;
  const r = 26, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return "<div class=\"ring\"><svg width=\"64\" height=\"64\">" +
    "<circle cx=\"32\" cy=\"32\" r=\"" + r + "\" stroke=\"#1e2129\" stroke-width=\"6\" fill=\"none\"/>" +
    "<circle cx=\"32\" cy=\"32\" r=\"" + r + "\" stroke=\"url(#grad)\" stroke-width=\"6\" fill=\"none\" stroke-dasharray=\"" + c + "\" stroke-dashoffset=\"" + offset + "\" stroke-linecap=\"round\"/>" +
    "<defs><linearGradient id=\"grad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"><stop offset=\"0%\" stop-color=\"#9945FF\"/><stop offset=\"100%\" stop-color=\"#14F195\"/></linearGradient></defs>" +
    "</svg><div class=\"pct\">" + pct.toFixed(0) + "%</div></div>";
}

function renderAlerts(anomalies){
  const el = document.getElementById("alerts");
  if(!anomalies || anomalies.length === 0){
    el.innerHTML = "";
    return;
  }
  const order = {critical:0, warning:1, info:2};
  const sorted = anomalies.slice().sort(function(a,b){ return order[a.severity]-order[b.severity]; });
  el.innerHTML = sorted.map(function(a){
    return "<div class=\"alert " + a.severity + "\"><span class=\"badge\">" + a.severity + "</span> " + a.message + "</div>";
  }).join("");
}

function mountTradingViewWidget(){
  const container = document.getElementById("tv-widget-container");
  if(!container) return;
  // Scripts inserted via innerHTML don't execute in browsers, so the
  // TradingView embed script has to be created and appended via the DOM
  // API directly, each time this tab re-renders.
  const script = document.createElement("script");
  script.type = "text/javascript";
  script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
  script.async = true;
  script.text = JSON.stringify({
    autosize: true,
    symbol: "BINANCE:SOLUSDT",
    interval: "D",
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "en",
    backgroundColor: "rgba(17, 19, 24, 1)",
    gridColor: "rgba(30, 33, 41, 1)",
    hide_top_toolbar: false,
    hide_legend: false,
    allow_symbol_change: false,
    support_host: "https://www.tradingview.com"
  });
  container.appendChild(script);
}

function setupTabs(){
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
      document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.remove("active"); });
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });
}

let LAST_RENDERED_GENERATED_UNIX = null;

async function load(){
  try{
    const res = await fetch(DATA_URL, {cache: "no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const payload = await res.json();
    const newGeneratedUnix = payload.report && payload.report.meta ? payload.report.meta.generated_at_unix : null;

    // The bot only regenerates data.json roughly every 30 minutes, but we
    // fetch it every heartbeat loop (~4s) so the dashboard picks up fresh
    // data as soon as it's available. Re-fetching is cheap (it's a static
    // file), but fully re-rendering the DOM/charts every 4s causes visible
    // flicker for no reason when the content hasn't actually changed — so
    // only rebuild the page when the report is genuinely newer than what's
    // currently shown.
    const isFirstLoad = REPORT === null;
    const hasNewData = newGeneratedUnix !== null && newGeneratedUnix !== LAST_RENDERED_GENERATED_UNIX;

    REPORT = payload.report;
    ANOMALIES = payload.anomalies || [];
    HISTORY = payload.history_series || [];
    LAST_GENERATED_UNIX = newGeneratedUnix;

    tickUpdatedLabel();

    if(!isFirstLoad && !hasNewData){
      return; // nothing new — skip re-render entirely, no flicker
    }
    LAST_RENDERED_GENERATED_UNIX = newGeneratedUnix;

    renderAlerts(ANOMALIES);

    if(document.getElementById("tab-overview") === null){
      document.getElementById("content").innerHTML =
        "<div class=\"tab-panel active\" id=\"tab-overview\"></div>" +
        "<div class=\"tab-panel\" id=\"tab-network\"></div>" +
        "<div class=\"tab-panel\" id=\"tab-validators\"></div>" +
        "<div class=\"tab-panel\" id=\"tab-defi\"></div>" +
        "<div class=\"tab-panel\" id=\"tab-ecosystem\"></div>";
      setupTabs();
    }
    renderAllTabs();

    document.getElementById("footer").innerHTML =
      "Data: Solana RPC · DeFiLlama · CoinGecko — refreshed automatically. " +
      "<a href=\"https://github.com/YOUR_GITHUB_USERNAME/solpulse-canada\" target=\"_blank\">Source on GitHub</a>";
  }catch(err){
    document.getElementById("content").innerHTML =
      "<div class=\"err\">Couldn't load data.json (" + err.message + "). If you're running this locally, " +
      "run <code>python -m src.main</code> first to generate dashboard/data.json, then reload.</div>";
  }
}

load();
// Re-check for fresh data each time the heartbeat line completes one full
// loop across the screen. load() itself decides whether that data is
// actually new before touching the DOM (see comment above) — this keeps
// the dashboard current without re-rendering (and flickering) every loop.
document.getElementById("heartbeat-path").addEventListener("animationiteration", load);
setInterval(tickUpdatedLabel, 1000);
</script>
